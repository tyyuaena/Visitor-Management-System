# Elastic Beanstalk's PHP platform (Amazon Linux 2023) serves the
# application root by default — but a Laravel app's front controller and
# framework internals live under public/, and everything above it
# (app/, config/, database/, storage/, vendor/, .env) must never be
# directly web-accessible. Without this override, requests would either
# 404 (no index.php at the app root) or, worse, expose source/config files.
#
# This file is included inside the platform's generated `server {}` block
# (via its own `include conf.d/elasticbeanstalk/*.conf;`), so the `root`
# and `location` directives below take effect for the live server.
root /var/app/current/public;
index index.html index.php;

# No custom gzip block here: this file is `include`d straight into the
# platform's own server {} block, which already sets `gzip on;` — adding
# it again is a hard nginx config-test failure ("gzip" directive is
# duplicate), not just a harmless override. Confirmed via
# /var/log/nginx/error.log after a deploy came up 503 on every instance:
# nginx never started because `nginx -t` failed before the proxy could
# reload, so the ELB saw every instance as unhealthy.

# The built React SPA (frontend/dist, copied into public/ before deploy —
# see bin/build-frontend.sh) is served straight from disk. Only /api is
# routed to Laravel; everything else falls back to the SPA's index.html so
# client-side routes (e.g. /dashboard) resolve without ever invoking PHP.
location /api {
    try_files $uri $uri/ /index.php?$query_string;
}

# Vite fingerprints every filename with a content hash (e.g.
# index-B0thjQ0o.js), so a given filename's contents never change — safe to
# tell the browser to cache it for a year instead of re-fetching on every
# visit. A new deploy produces new hashed filenames rather than overwriting
# these.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# index.html is the one file that DOES change on every deploy (it references
# that build's hashed asset filenames), so it must never be cached — a
# stale copy would point the browser at filenames that no longer exist.
location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php-fpm/www.sock;
    fastcgi_index index.php;

    # `include fastcgi_params;` depends on a file nginx ships at a
    # standard path — but this platform's `nginx -t` staging test runs
    # against a staging directory (/var/proxy/staging/nginx/) that
    # doesn't contain it, failing the config test outright ("open()
    # ... fastcgi_params failed"). Inlining the standard parameters
    # avoids depending on that file's presence at all.
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI $document_uri;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param REQUEST_SCHEME $scheme;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param REDIRECT_STATUS 200;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param DOCUMENT_ROOT $document_root;
}

# Block direct access to anything outside public/ that nginx might
# otherwise be asked to serve as a static file.
location ~ /\.(?!well-known) {
    deny all;
}
